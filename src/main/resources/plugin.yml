name: AzDown
version: ${version}
main: dev.azdown.AzDownPlugin
api-version: '1.21'
authors: [AzDown]
description: Browse plugins from Modrinth, Spigot, and Hangar inside Minecraft.
commands:
  azdown:
    description: Open the plugin browser GUI or reload plugin configuration.
    usage: /azdown [reload|search query]
    permission: azdown.use
permissions:
  azdown.use:
    default: true
  azdown.admin.reload:
    default: op
